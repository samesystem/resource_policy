require: rubocop-rspec

RSpec/NestedGroups:
  Enabled: false

# Policy specs build a small world before they can assert anything - a record, a
# relation, a nested policy, a viewer - and naming each piece reads better than
# folding them into one setup block.
RSpec/MultipleMemoizedHelpers:
  Enabled: false

Layout/LineLength:
  Enabled: true
  Max: 120

Metrics/BlockLength:
  Exclude:
    - spec/**/*.rb
    - resource_policy.gemspec
Metrics/ModuleLength:
  Exclude:
    - spec/**/*_spec.rb
Metrics/ClassLength:
  Exclude:
    - spec/**/*_spec.rb

Lint/AmbiguousBlockAssociation:
  Exclude:
    - spec/**/*.rb

Naming/MethodParameterName:
  AllowedNames:
    - 'to'
    - 'at'
    - 'on'
    - 'id'
    - 'in'
    - 'as'

Style/ClassAndModuleChildren:
  Exclude:
    - spec/**/*_spec.rb

AllCops:
  TargetRubyVersion: 2.5
  Exclude:
    - bin/*
    - graphql_rails.gemspec
    - Rakefile
